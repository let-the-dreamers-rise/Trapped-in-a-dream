plugins { id 'com.android.application' }

android {
    namespace 'com.gaterank1.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gaterank1.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed so the APK installs directly without a release keystore.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
